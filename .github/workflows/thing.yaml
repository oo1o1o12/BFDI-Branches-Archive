name: Release

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version Check
        id: version_check
        run: |
          version=$(curl -f -s "https://api.bfdibranches.com/new/version.php")
          latest=$(jq -r -n --argjson data "$version" '$data.latest')
          
          if [ -f version.txt ]; then
            current=$(cat version.txt)
          else
            current="blehh :P"
          fi
          if [ -z "$latest" ]; then
            echo "Could not get version."
            exit 1
          fi
          if [ "$latest" != "$current" ]; then
            echo "$latest" > version.txt
            echo "new=true" >> $GITHUB_ENV
            echo "releaseTag=v$latest" >> $GITHUB_ENV
          else
            echo "Up to date."
            exit 0
          fi

      - name: Commit
        if: env.new == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "update version [skip ci]"
          git push

      - name: Zippy
        if: env.new == 'true' # istg ANY of these could FAIL and KILL the WHOLE thing
        run: |
            curl --retry 5 -s -o "bfdibranches.pck" https://bfdibranches.com/new/bfdibranches.pck
            curl --retry 5 -s -o "bfdibranches.exe" https://bfdibranches.com/new/bfdibranches.exe
            curl --retry 5 -s -o "bfdibranches.sh" https://bfdibranches.com/new/bfdibranches.sh
            curl --retry 5 -s -o "bfdibranches.x84_64" https://bfdibranches.com/new/bfdibranches.x84_64
            curl --retry 5 -s -o "bfdibranches.app.zip" https://bfdibranches.com/new/bfdibranches.app.zip
            if [ -f bfdibranches.pck ]; then
              zip -r -q branches.zip "bfdibranches.pck"
              if [ -f bfdibranches.exe ]; then
                zip -r -q branches_windows.zip "bfdibranches.exe" "bfdibranches.pck"
              fi
                if [ -f bfdibranches.x84_64 ] && [ -f bfdibranches.sh ]; then
                zip -r -q branches_linux.zip "bfdibranches.sh" "bfdibranches.x84_64" "bfdibranches.pck"
              fi
              if [ -f bfdibranches.app.zip ]; then
                unzip bfdibranches.app.zip
                chmod +x "BFDI- Branches.app/Contents/MacOS/BFDI- Branches"
                cp bfdibranches.pck "BFDI- Branches.app/Contents/Resources/BFDI- Branches.pck"
                zip -r -q branches_macos.zip "BFDI- Branches.app"
              fi
            fi
      
      - name: Make Release
        if: env.new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.releaseTag }}
          body: A version of BFDI Branches.
          files: |
            branches.zip
            branches_windows.zip
            branches_macos.zip
            branches_linux.zip
