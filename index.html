<!DOCTYPE html>
<html>

<head>
	<title>BFDI: Branches - Archive</title>
	<link rel="stylesheet" href="index.css">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
	<div class="container">
		<div class="background"></div>
	</div>
	<img class="logo" src="images/logo.png" alt="Logo" style="padding: 20px;">
	<p>
		An unofficial version archive of BFDI: Branches
		<br>
		<a href="https://github.com/oo1o1o12/BFDI-Branches-Archive" target="_blank">
			<img src="images/buttons/github.png" style="max-width: 40px;">
		</a>
	</p>
	<div style="font-size: 15px; color: darkgray;">
		For versions v0.3.9 and later, you have to replace the version from the launcher to the version you'd wish to
		use.<br>
	</div>
	<div style="font-size: 15px; color: red;">
		Make sure to back up your current version!
	</div>
	<div id="versionsContainer" style="width: 100%; padding: 20px 8%; box-sizing: border-box;">
	</div>
	<div id="versionsGrid"
		style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); column-gap: 0px; row-gap: 40px; justify-content: center; padding: 20px; margin-left: 100px; margin-right: 100px">
	</div>
	</div>
	<img style="max-width: 550px;" src="images/people.png" style="padding: 20px;">
	<p style="font-size: 20px; color: deepskyblue;">
		If you have a PCK file of a version that's missing, contact @oo1o1o12 on Discord.
	</p>
	<script type="module" src="getversions.js"></script>
</body>

</html>
